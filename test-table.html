<!DOCTYPE html>
<html>
<head>
    <title>Test Table Data</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .status { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>Test: Table Data Loading</h1>
    <div id="status"></div>

    <table id="test-table">
        <thead>
            <tr>
                <th>Фронт</th>
                <th>Дней</th>
                <th>Всего потерь</th>
                <th>Тип</th>
            </tr>
        </thead>
        <tbody id="test-tbody">
        </tbody>
    </table>

    <script src="js/csv-data-loader.js"></script>
    <script>
        const statusDiv = document.getElementById('status');

        function addStatus(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            statusDiv.appendChild(div);
            console.log(message);
        }

        async function testDataLoading() {
            try {
                addStatus('Testing data loading...', 'info');

                // Check if CSVDataLoader is available
                if (typeof CSVDataLoader === 'undefined') {
                    addStatus('ERROR: CSVDataLoader not loaded!', 'error');
                    return;
                }

                addStatus('CSVDataLoader loaded successfully', 'success');

                // Create loader instance
                const loader = new CSVDataLoader();
                addStatus('Created CSVDataLoader instance', 'info');

                // Load data
                addStatus('Loading data...', 'info');
                const units = await loader.loadAllData();

                addStatus(`Loaded ${units.length} units`, units.length > 0 ? 'success' : 'error');

                if (units.length === 0) {
                    addStatus('No data loaded - this is the problem!', 'error');
                    return;
                }

                // Show first few units
                addStatus(`First unit: ${units[0].name} (${units[0].type}) - ${units[0].totalLosses} losses`, 'info');

                // Populate table
                const tbody = document.getElementById('test-tbody');
                tbody.innerHTML = '';

                units.slice(0, 20).forEach((unit, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${unit.name}</td>
                        <td>${unit.days}</td>
                        <td>${unit.totalLosses || 0}</td>
                        <td>${unit.type}</td>
                    `;
                    tbody.appendChild(row);
                });

                addStatus(`Table populated with ${Math.min(20, units.length)} rows`, 'success');

            } catch (error) {
                addStatus(`ERROR: ${error.message}`, 'error');
                console.error(error);
            }
        }

        // Run test when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', testDataLoading);
        } else {
            testDataLoading();
        }
    </script>
</body>
</html>
