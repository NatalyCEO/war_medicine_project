<!DOCTYPE html>
<html>
<head>
    <title>Debug Table</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Debug: Table Loading</h1>
    <div id="log"></div>

    <table id="test-table">
        <thead>
            <tr>
                <th>Фронт</th>
                <th>Дней</th>
                <th>Всего потерь</th>
            </tr>
        </thead>
        <tbody id="test-tbody">
            <tr><td colspan="3">Loading...</td></tr>
        </tbody>
    </table>

    <script src="js/csv-data-loader.js"></script>
    <script>
        const log = document.getElementById('log');

        function addLog(message, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = new Date().toLocaleTimeString() + ': ' + message;
            log.appendChild(div);
            console.log(message);
        }

        async function testLoading() {
            try {
                addLog('Starting test...');

                // Test CSVDataLoader
                if (typeof CSVDataLoader === 'undefined') {
                    addLog('CSVDataLoader not loaded!', 'error');
                    return;
                }

                addLog('CSVDataLoader available, creating instance...');
                const loader = new CSVDataLoader();

                addLog('Calling loadAllData()...');
                const units = await loader.loadAllData();

                addLog('Loaded ' + units.length + ' units', 'success');

                if (units.length > 0) {
                    addLog('First unit: ' + JSON.stringify(units[0]), 'success');

                    // Populate table
                    const tbody = document.getElementById('test-tbody');
                    tbody.innerHTML = '';

                    units.slice(0, 10).forEach(unit => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${unit.name}</td>
                            <td>${unit.days}</td>
                            <td>${unit.totalLosses}</td>
                        `;
                        tbody.appendChild(row);
                    });

                    addLog('Table populated with first 10 units', 'success');
                } else {
                    addLog('No units loaded!', 'error');
                }

            } catch (error) {
                addLog('Error: ' + error.message, 'error');
                console.error(error);
            }
        }

        // Start test
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', testLoading);
        } else {
            testLoading();
        }
    </script>
</body>
</html>
